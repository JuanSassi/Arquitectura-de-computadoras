<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Diagrama general: uart_alu_top (Basys3, 100 MHz)</text>

  <!-- top level -->
  <rect x="140" y="50" width="830" height="470" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="152" y="70" font-size="13" fill="#6b7280" font-weight="600">uart_alu_top</text>

  <!-- uart_rx -->
  <rect x="230" y="90" width="180" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">uart_rx</text>
  <text x="320" y="144" text-anchor="middle" font-size="12" fill="#1e3a8a">FSM: idle → start</text>
  <text x="320" y="160" text-anchor="middle" font-size="12" fill="#1e3a8a">→ data → stop</text>
  <text x="320" y="178" text-anchor="middle" font-size="11" fill="#1e3a8a">serie → byte</text>

  <!-- baud -->
  <rect x="230" y="250" width="180" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">baud_rate_gen</text>
  <text x="320" y="298" text-anchor="middle" font-size="12" fill="#78350f">contador módulo 326</text>
  <text x="320" y="312" text-anchor="middle" font-size="11" fill="#78350f">tick ×16 por bit</text>

  <!-- uart_tx -->
  <rect x="230" y="380" width="180" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">uart_tx</text>
  <text x="320" y="434" text-anchor="middle" font-size="12" fill="#1e3a8a">FSM: idle → start</text>
  <text x="320" y="450" text-anchor="middle" font-size="12" fill="#1e3a8a">→ data → stop</text>
  <text x="320" y="468" text-anchor="middle" font-size="11" fill="#1e3a8a">byte → serie</text>

  <!-- interface -->
  <rect x="520" y="90" width="190" height="390" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">uart_interface</text>
  <text x="615" y="282" text-anchor="middle" font-size="12" fill="#14532d">2 FIFO desacoplan</text>
  <text x="615" y="298" text-anchor="middle" font-size="12" fill="#14532d">cable y circuito</text>
  <text x="615" y="320" text-anchor="middle" font-size="11" fill="#14532d">tx_start = ~tx_empty</text>
  <rect x="540" y="105" width="150" height="95" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">sync_fifo (rx)</text>
  <text x="615" y="146" text-anchor="middle" font-size="11" fill="#14532d">16 bytes recibidos</text>
  <rect x="540" y="372" width="150" height="95" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">sync_fifo (tx)</text>
  <text x="615" y="413" text-anchor="middle" font-size="11" fill="#14532d">16 bytes a enviar</text>

  <!-- alu ctrl -->
  <rect x="800" y="105" width="150" height="360" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="875" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">alu_uart_ctrl</text>
  <text x="875" y="150" text-anchor="middle" font-size="11" fill="#4c1d95">FSM del protocolo</text>
  <text x="875" y="196" text-anchor="middle" font-size="12" fill="#4c1d95">A → B → OP</text>
  <text x="875" y="214" text-anchor="middle" font-size="12" fill="#4c1d95">→ CALC → SEND</text>
  <text x="875" y="250" text-anchor="middle" font-size="11" fill="#4c1d95">a_reg, b_reg, op_reg</text>
  <text x="875" y="266" text-anchor="middle" font-size="11" fill="#4c1d95">res_reg</text>
  <rect x="815" y="300" width="120" height="70" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="875" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">alu (TP1)</text>
  <text x="875" y="347" text-anchor="middle" font-size="11" fill="#4c1d95">combinacional</text>
  <text x="875" y="361" text-anchor="middle" font-size="11" fill="#4c1d95">ADD SUB AND OR…</text>

  <!-- pines -->
  <line x1="95" y1="130" x2="221.0" y2="130.0" stroke="#374151" stroke-width="1.8"/><polygon points="230.0,130.0 221.0,134.5 221.0,125.5" fill="#374151"/>
  <text x="20" y="127" font-size="13" font-weight="700" fill="#111827">rx</text><text x="20" y="142" font-size="10" fill="#6b7280">pin B18</text>
  <line x1="95" y1="285" x2="221.0" y2="285.0" stroke="#374151" stroke-width="1.8"/><polygon points="230.0,285.0 221.0,289.5 221.0,280.5" fill="#374151"/>
  <text x="20" y="282" font-size="13" font-weight="700" fill="#111827">clk</text><text x="20" y="297" font-size="10" fill="#6b7280">pin W5 100 MHz</text>
  <line x1="230" y1="440" x2="104.0" y2="440.0" stroke="#374151" stroke-width="1.8"/><polygon points="95.0,440.0 104.0,435.5 104.0,444.5" fill="#374151"/>
  <text x="20" y="437" font-size="13" font-weight="700" fill="#111827">tx</text><text x="20" y="452" font-size="10" fill="#6b7280">pin A18</text>

  <!-- baud -> rx / tx -->
  <line x1="320" y1="250" x2="320.0" y2="199.0" stroke="#d97706" stroke-width="2"/><polygon points="320.0,190.0 324.5,199.0 315.5,199.0" fill="#d97706"/>
  <text x="330" y="226" font-size="12" font-weight="600" fill="#b45309">s_tick</text>
  <line x1="320" y1="320" x2="320.0" y2="371.0" stroke="#d97706" stroke-width="2"/><polygon points="320.0,380.0 315.5,371.0 324.5,371.0" fill="#d97706"/>
  <text x="330" y="356" font-size="12" font-weight="600" fill="#b45309">s_tick</text>

  <!-- rx -> fifo rx -->
  <line x1="410" y1="125" x2="531.0" y2="125.0" stroke="#374151" stroke-width="1.8"/><polygon points="540.0,125.0 531.0,129.5 531.0,120.5" fill="#374151"/>
  <text x="415" y="119" font-size="11" fill="#111827">rx_done_tick</text>
  <line x1="410" y1="165" x2="531.0" y2="165.0" stroke="#374151" stroke-width="2.6"/><polygon points="540.0,165.0 531.0,169.5 531.0,160.5" fill="#374151"/>
  <text x="415" y="159" font-size="11" fill="#111827">dout[7:0]</text>

  <!-- fifo rx -> ctrl -->
  <line x1="690" y1="125" x2="791.0" y2="125.0" stroke="#374151" stroke-width="1.8"/><polygon points="800.0,125.0 791.0,129.5 791.0,120.5" fill="#374151"/>
  <text x="705" y="119" font-size="11" fill="#111827">rx_empty</text>
  <line x1="690" y1="160" x2="791.0" y2="160.0" stroke="#374151" stroke-width="2.6"/><polygon points="800.0,160.0 791.0,164.5 791.0,155.5" fill="#374151"/>
  <text x="705" y="154" font-size="11" fill="#111827">r_data[7:0]</text>
  <line x1="800" y1="190" x2="699.0" y2="190.0" stroke="#374151" stroke-width="1.8"/><polygon points="690.0,190.0 699.0,185.5 699.0,194.5" fill="#374151"/>
  <text x="745" y="184" font-size="11" fill="#111827">rd</text>

  <!-- ctrl -> fifo tx -->
  <line x1="800" y1="395" x2="699.0" y2="395.0" stroke="#374151" stroke-width="2.6"/><polygon points="690.0,395.0 699.0,390.5 699.0,399.5" fill="#374151"/>
  <text x="705" y="389" font-size="11" fill="#111827">w_data[7:0]</text>
  <line x1="800" y1="420" x2="699.0" y2="420.0" stroke="#374151" stroke-width="1.8"/><polygon points="690.0,420.0 699.0,415.5 699.0,424.5" fill="#374151"/>
  <text x="745" y="414" font-size="11" fill="#111827">wr</text>
  <line x1="690" y1="450" x2="791.0" y2="450.0" stroke="#374151" stroke-width="1.8"/><polygon points="800.0,450.0 791.0,454.5 791.0,445.5" fill="#374151"/>
  <text x="715" y="444" font-size="11" fill="#111827">tx_full</text>

  <!-- fifo tx -> tx -->
  <line x1="540" y1="395" x2="419.0" y2="395.0" stroke="#374151" stroke-width="2.6"/><polygon points="410.0,395.0 419.0,390.5 419.0,399.5" fill="#374151"/>
  <text x="420" y="389" font-size="11" fill="#111827">tx_din[7:0]</text>
  <line x1="540" y1="420" x2="419.0" y2="420.0" stroke="#374151" stroke-width="1.8"/><polygon points="410.0,420.0 419.0,415.5 419.0,424.5" fill="#374151"/>
  <text x="440" y="414" font-size="11" fill="#111827">tx_start</text>
  <line x1="410" y1="452" x2="531.0" y2="452.0" stroke="#374151" stroke-width="1.8"/><polygon points="540.0,452.0 531.0,456.5 531.0,447.5" fill="#374151"/>
  <text x="415" y="446" font-size="11" fill="#111827">tx_done_tick</text>

  <!-- leyenda -->
  <rect x="150" y="535" width="14" height="14" fill="#fef3c7" stroke="#d97706"/><text x="170" y="547" font-size="12" fill="#374151">base de tiempo</text>
  <rect x="280" y="535" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/><text x="300" y="547" font-size="12" fill="#374151">UART (FSM)</text>
  <rect x="390" y="535" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/><text x="410" y="547" font-size="12" fill="#374151">buffers</text>
  <rect x="480" y="535" width="14" height="14" fill="#ede9fe" stroke="#7c3aed"/><text x="500" y="547" font-size="12" fill="#374151">control + ALU</text>
  <line x1="610" y1="542" x2="645" y2="542" stroke="#374151" stroke-width="1.8"/><text x="652" y="547" font-size="12" fill="#374151">1 bit</text>
  <line x1="705" y1="542" x2="740" y2="542" stroke="#374151" stroke-width="2.6"/><text x="747" y="547" font-size="12" fill="#374151">bus de 8 bits</text>
  <text x="860" y="547" font-size="11" fill="#6b7280">clk y reset llegan a todos</text>
</svg>
